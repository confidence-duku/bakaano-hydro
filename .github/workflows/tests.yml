name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install smoke-test dependencies
        run: python -m pip install --upgrade pip setuptools pytest numpy

      - name: Install package without heavyweight runtime dependencies
        run: python -m pip install --no-deps -e .

      - name: Compile package
        run: python -m compileall -q bakaano

      - name: Run smoke tests
        run: python -m pytest -q
