name: Publish Docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCS_DOMAIN: ${{ vars.DOCS_DOMAIN }}
      DOCS_BASE_URL: ${{ vars.DOCS_DOMAIN != '' && format('https://{0}', vars.DOCS_DOMAIN) || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build Sphinx docs
        run: python -m sphinx -W --keep-going -b html docs/source docs/_build/html

      - name: Write GitHub Pages support files
        run: |
          touch docs/_build/html/.nojekyll
          if [ -n "${DOCS_DOMAIN}" ]; then
            printf '%s\n' "${DOCS_DOMAIN}" > docs/_build/html/CNAME
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
