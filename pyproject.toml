[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bakaano-hydro"
version = "2.0"
description = "Distributed hydrology-guided neural network for streamflow prediction"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Confidence Duku", email = "confidence.duku@gmail.com" }]
keywords = ["hydrology", "earth system", "flood forecasting", "deep learning", "streamflow prediction", "climate risk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Hydrology",
  "Programming Language :: Python :: 3.10",
  "Operating System :: OS Independent",
]
dependencies = [
  "dask>=2024.11,<2026",
  "earthengine-api>=1.4,<2",
  "fiona>=1.10,<2",
  "future>=1,<2",
  "geemap>=0.35,<0.40",
  "geopandas>=1.1,<2",
  "hydroeval>=0.1,<1",
  "ipyleaflet>=0.19,<1",
  "ipython>=8.12,<9",
  "isimip-client>=1.0,<2",
  "keras>=3.12,<4",
  "keras-tcn>=3.5,<4",
  "leafmap>=0.43,<0.50",
  "localtileserver>=0.10,<0.11",
  "matplotlib>=3.9,<4",
  "netCDF4>=1.7,<2",
  "numba>=0.60,<0.62",
  "numpy>=1.26,<2.1",
  "pandas>=2.2,<2.4",
  "pyproj>=3.7,<4",
  "pysheds>=0.3,<0.4",
  "rasterio>=1.4,<2",
  "requests>=2.32,<3",
  "rioxarray>=0.18,<0.20",
  "scikit-learn>=1.5,<1.7",
  "scipy>=1.14,<2",
  "shapely>=2.0,<2.2",
  "tensorflow>=2.18,<2.20",
  "tensorflow-probability>=0.25,<0.27",
  "tf-keras>=2.18,<2.20",
  "tqdm>=4.67,<5",
  "whitebox>=2.3,<3",
  "xarray>=2024.10,<2026",
]

[project.optional-dependencies]
gpu = [
  "nvidia-cublas-cu12==12.5.3.2",
  "nvidia-cuda-cupti-cu12==12.5.82",
  "nvidia-cuda-nvcc-cu12==12.5.82",
  "nvidia-cuda-nvrtc-cu12==12.5.82",
  "nvidia-cuda-runtime-cu12==12.5.82",
  "nvidia-cudnn-cu12==9.3.0.75",
  "nvidia-cufft-cu12==11.2.3.61",
  "nvidia-curand-cu12==10.3.6.82",
  "nvidia-cusolver-cu12==11.6.3.83",
  "nvidia-cusparse-cu12==12.5.1.3",
  "nvidia-nvjitlink-cu12==12.5.82",
]
test = ["pytest>=8,<9"]

[project.urls]
Homepage = "https://github.com/confidence-duku/bakaano-hydro"
Source = "https://github.com/confidence-duku/bakaano-hydro"
"Bug Tracker" = "https://github.com/confidence-duku/bakaano-hydro/issues"
Documentation = "https://confidence-duku.github.io/bakaano-hydro/"

[tool.setuptools.packages.find]
include = ["bakaano*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
